name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sincronizar ambiente travado
        run: uv sync --group dev --extra api --frozen
      - name: Estilo
        run: uv run ruff check .
      - name: Formatação
        run: uv run ruff format --check .
      - name: Tipos
        run: uv run mypy
      - name: Bundles sincronizados com a fonte compartilhada
        run: uv run python packaging/build_bundles.py --check
      - name: Testes determinísticos sem rede e sem credencial
        run: uv run pytest -m "not integration"

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Construir wheel e sdist
        run: uv build
      - name: Instalar o pacote produzido em ambiente isolado
        run: |
          uv venv /tmp/isolado
          VIRTUAL_ENV=/tmp/isolado uv pip install dist/*.whl
          /tmp/isolado/bin/ado-team-compass version
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
