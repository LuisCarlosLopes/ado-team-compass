[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ado-team-compass"
version = "0.2.0"
description = "Visibilidade de entrega no Azure DevOps com cálculos auditáveis, exclusivamente via MCP oficial."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Luis Carlos Lopes Jr." }]
keywords = ["azure-devops", "mcp", "delivery", "metrics"]
classifiers = [
  "Private :: Do Not Upload",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "pydantic>=2.9,<3",
  "PyYAML>=6.0.2,<7",
  "Jinja2>=3.1.4,<4",
  "tzdata>=2024.2",
  "mcp>=1.9,<2",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115,<1",
    "pyjwt[crypto]>=2.9,<3",
    "uvicorn>=0.32,<1",
]

[project.scripts]
ado-team-compass = "ado_team_compass.cli:main"
# Servidor MCP do motor: é este o processo que o host de IA sobe.
ado-team-compass-mcp = "ado_team_compass.server.__main__:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.7",
  "mypy>=1.13",
  "types-PyYAML>=6.0.12",
  "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ado_team_compass"]
artifacts = [
  "src/ado_team_compass/profiles/*.yaml",
  "src/ado_team_compass/schemas/*.json",
  "src/ado_team_compass/reporting/templates/*",
  "src/ado_team_compass/demo/*.json",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ANN", "PTH"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]
# FastAPI declara dependências e parâmetros de consulta como defaults; é o idioma do framework.
"src/ado_team_compass/gateway/app.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "packaging"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["integration: requires real ADO access (opt-in, never in public CI)"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
